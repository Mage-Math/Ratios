<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ratio Bar Model Solver</title>
  <style>
    :root {
      --primary: #4f46e5;
      --secondary: #06b6d4;
      --accent-green: #10b981;
      --accent-red: #ef4444;
      --bg-gradient: linear-gradient(135deg, #e0e7ff 0%, #fae8ff 100%);
      --card-bg: rgba(255, 255, 255, 0.96);
      --text-dark: #1e1b4b;
    }

    * {
      box-sizing: border-box;
      font-family: 'Fredoka', 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background: var(--bg-gradient);
      background-attachment: fixed;
      color: var(--text-dark);
      margin: 0;
      padding: 20px;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    #confettiCanvas {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      pointer-events: none;
      z-index: 9999;
    }

    .main-wrapper {
      max-width: 950px;
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    .container {
      background: var(--card-bg);
      padding: 30px;
      border-radius: 24px;
      box-shadow: 0 15px 35px rgba(0,0,0,0.1);
      border: 4px solid #ffffff;
      position: relative;
    }

    /* Top Stats Bar */
    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: #f1f5f9;
      padding: 12px 25px;
      border-radius: 18px;
      margin-bottom: 20px;
      border: 2px solid #e2e8f0;
    }

    .stat-badge {
      font-size: 1.2rem;
      font-weight: 800;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .score-badge { color: #d97706; }
    .streak-badge { color: #dc2626; }

    /* Mascot Stage */
    .mascot-stage {
      display: flex;
      align-items: center;
      gap: 20px;
      margin-bottom: 20px;
      background: #f0f9ff;
      padding: 15px 20px;
      border-radius: 20px;
      border: 3px dashed #38bdf8;
    }

    .mascot-avatar {
      width: 80px;
      height: 80px;
      flex-shrink: 0;
    }

    .mascot-dialog {
      background: white;
      padding: 12px 18px;
      border-radius: 16px;
      font-size: 1.1rem;
      font-weight: 700;
      color: #1e293b;
      border: 2px solid #00d2ff;
      flex-grow: 1;
    }

    /* Question Box */
    .problem-card {
      background: linear-gradient(135deg, #4f46e5 0%, #7c3aed 100%);
      color: white;
      border-radius: 18px;
      padding: 22px;
      margin-bottom: 20px;
      box-shadow: 0 10px 20px rgba(79, 70, 229, 0.25);
    }

    .problem-number {
      font-size: 1rem;
      text-transform: uppercase;
      letter-spacing: 1px;
      opacity: 0.85;
      font-weight: 800;
      margin-bottom: 5px;
    }

    .problem-text {
      font-size: 1.3rem;
      font-weight: 700;
      line-height: 1.5;
    }

    /* Pictorial Bar Model Container */
    .pictorial-card {
      background: #ffffff;
      border: 3px solid #cbd5e1;
      border-radius: 18px;
      padding: 20px;
      margin-bottom: 25px;
      text-align: left;
      overflow-x: auto;
    }

    .pictorial-title {
      font-size: 1rem;
      font-weight: 800;
      color: #64748b;
      text-transform: uppercase;
      margin-bottom: 15px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .bar-row {
      display: flex;
      align-items: center;
      margin-bottom: 12px;
      gap: 15px;
    }

    .bar-label {
      width: 140px;
      font-weight: 800;
      font-size: 1.05rem;
      color: #334155;
      flex-shrink: 0;
    }

    .bar-units-group {
      display: flex;
      gap: 6px;
      flex-shrink: 0;
    }

    .unit-block {
      width: 65px;
      height: 48px;
      flex-shrink: 0;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 800;
      font-size: 0.9rem;
      color: white;
      border: 2px solid rgba(0,0,0,0.15);
      box-shadow: 0 3px 6px rgba(0,0,0,0.05);
    }

    .known-badge {
      background: #fef3c7;
      border: 2px solid #f59e0b;
      color: #92400e;
      padding: 6px 12px;
      border-radius: 8px;
      font-size: 0.95rem;
      font-weight: 800;
      margin-left: 10px;
      white-space: nowrap;
      flex-shrink: 0;
    }

    .challenge-badge {
      display: inline-block;
      background: #fef3c7;
      color: #b45309;
      border: 2px solid #f59e0b;
      font-weight: 900;
      padding: 6px 14px;
      border-radius: 12px;
      margin-bottom: 12px;
    }

    /* Scaffolding Form Workings */
    .working-box {
      background: #f8fafc;
      border: 3px solid #e2e8f0;
      border-radius: 18px;
      padding: 20px;
      margin-bottom: 25px;
      text-align: left;
    }

    .step-line {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 1.15rem;
      font-weight: 700;
      margin-bottom: 15px;
      flex-wrap: wrap;
    }

    .math-input {
      width: 90px;
      padding: 10px;
      font-size: 1.2rem;
      font-weight: 800;
      text-align: center;
      border: 3px solid #cbd5e1;
      border-radius: 12px;
      outline: none;
      transition: all 0.2s;
    }

    .math-input.correct {
      border-color: var(--accent-green) !important;
      background: #ecfdf5 !important;
      color: #065f46 !important;
    }

    .math-input.incorrect {
      border-color: var(--accent-red) !important;
      background: #fef2f2 !important;
      color: #991b1b !important;
    }

    .btn-submit {
      background: linear-gradient(45deg, #10b981, #06b6d4);
      color: white;
      border: none;
      padding: 14px 30px;
      font-size: 1.2rem;
      font-weight: 900;
      border-radius: 50px;
      cursor: pointer;
      box-shadow: 0 6px 0 #059669;
      transition: all 0.2s;
    }

    .btn-next {
      background: #4f46e5;
      color: white;
      border: none;
      padding: 12px 25px;
      font-size: 1.1rem;
      font-weight: 800;
      border-radius: 12px;
      cursor: pointer;
      margin-left: 10px;
    }

    .teacher-toggle-btn {
      background: transparent;
      border: none;
      color: #94a3b8;
      font-size: 0.85rem;
      cursor: pointer;
      margin-top: 10px;
      text-decoration: underline;
    }

    .teacher-panel {
      display: none;
      background: #ffffff;
      border: 3px solid #6366f1;
      border-radius: 20px;
      padding: 20px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.08);
    }

    .live-feed-table {
      width: 100%;
      border-collapse: collapse;
      text-align: left;
      font-size: 0.95rem;
    }

    .live-feed-table th {
      background: #f1f5f9;
      padding: 10px;
      color: #475569;
      font-weight: 800;
    }

    .live-feed-table td {
      padding: 10px;
      border-bottom: 1px solid #e2e8f0;
      font-weight: 600;
    }

    .status-tag {
      padding: 4px 10px;
      border-radius: 20px;
      font-size: 0.8rem;
      font-weight: 800;
    }

    .status-correct { background: #dcfce7; color: #15803d; }
    .status-incorrect { background: #fee2e2; color: #b91c1c; }
  </style>
</head>
<body>

<canvas id="confettiCanvas"></canvas>

<div class="main-wrapper">
  <div class="container">
    <div class="top-bar">
      <div class="stat-badge score-badge">⭐ Score: <span id="scoreVal">0</span></div>
      <div class="stat-badge streak-badge">🔥 Streak: <span id="streakVal">0</span></div>
    </div>

    <div class="mascot-stage">
      <svg id="mascotSVG" class="mascot-avatar" viewBox="0 0 100 100">
        <circle cx="50" cy="55" r="38" fill="#4f46e5" />
        <circle cx="50" cy="58" r="28" fill="#ffffff" opacity="0.9" />
        <polygon points="20,25 35,10 38,30" fill="#4f46e5" />
        <polygon points="80,25 65,10 62,30" fill="#4f46e5" />
        <circle cx="38" cy="45" r="12" fill="#ffffff" stroke="#1e1b4b" stroke-width="2"/>
        <circle cx="62" cy="45" r="12" fill="#ffffff" stroke="#1e1b4b" stroke-width="2"/>
        <circle cx="38" cy="45" r="6" fill="#1e1b4b" />
        <circle cx="62" cy="45" r="6" fill="#1e1b4b" />
        <polygon points="50,48 44,58 56,58" fill="#ffcc00" />
      </svg>
      <div class="mascot-dialog" id="mascotText">Loading question details...</div>
    </div>

    <!-- Question Text -->
    <div class="problem-card">
      <div class="problem-number" id="probNum">Question 1</div>
      <div class="problem-text" id="probText">Loading question...</div>
    </div>

    <!-- Pictorial Bar Model Display (Guided Mode Only) -->
    <div class="pictorial-card" id="pictorialCard">
      <div class="pictorial-title">🖼️ Equal-Part Bar Model Representation</div>
      <div id="barModelContainer"></div>
    </div>

    <!-- Input Details / Working Box -->
    <div class="working-box" id="workingContainer"></div>

    <div>
      <button class="btn-submit" id="checkBtn" onclick="checkAnswer()">Check Answer ➔</button>
      <button class="btn-next" id="nextBtn" onclick="nextQuestion()" style="display: none;">Next Problem ➔</button>
    </div>

    <button class="teacher-toggle-btn" onclick="toggleTeacherDashboard()">🔒 Teacher View</button>
  </div>

  <!-- Hidden Teacher Panel -->
  <div class="teacher-panel" id="teacherPanel">
    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px;">
      <div style="font-size: 1.2rem; font-weight: 900; color: #4338ca;">📊 Teacher Live Monitor</div>
      <button onclick="toggleTeacherDashboard()">Close Panel</button>
    </div>
    <table class="live-feed-table">
      <thead>
        <tr>
          <th>Time</th>
          <th>Question</th>
          <th>Student Input(s)</th>
          <th>Attempts</th>
          <th>Status</th>
        </tr>
      </thead>
      <tbody id="teacherLogBody">
        <tr><td colspan="5" style="text-align: center; color: #94a3b8; padding: 20px;">No inputs yet.</td></tr>
      </tbody>
    </table>
  </div>
</div>

<script>
  const questions = [
    // --- 5 GUIDED SCAFFOLDED QUESTIONS ---
    {
      id: 1,
      title: "Question 1: Sultanas & Cherries (5 : 2)",
      text: "To make a cake, Marco uses sultanas and cherries in the ratio 5:2. Marco uses 80g of cherries to make the cake.",
      guided: true,
      ratio: [
        { label: "Sultanas (5)", parts: 5, color: "#f59e0b", knownVal: "" },
        { label: "Cherries (2)", parts: 2, color: "#ef4444", knownVal: "= 80g total" }
      ],
      inputs: [
        { label: "Cherries: 2 parts = 80g, so 1 part = 80 ÷ 2 =", ans: 40, unit: "g" },
        { label: "Sultanas: 5 parts = 5 ×", ans: 40, unit: "" },
        { label: "Sultanas Mass =", ans: 200, unit: "g" },
        { label: "Total Mass = 80 +", ans: 200, unit: "" },
        { label: "Total Mass =", ans: 280, unit: "g" }
      ]
    },
    {
      id: 2,
      title: "Question 2: Raspberries & Strawberries (1 : 2)",
      text: "A fruit dessert contains raspberries and strawberries in the ratio 1:2. There are 400g of strawberries in the dessert.",
      guided: true,
      ratio: [
        { label: "Raspberries (1)", parts: 1, color: "#ec4899", knownVal: "" },
        { label: "Strawberries (2)", parts: 2, color: "#f43f5e", knownVal: "= 400g total" }
      ],
      inputs: [
        { label: "Strawberries: 2 parts = 400g, so 1 part = 400 ÷ 2 =", ans: 200, unit: "g" },
        { label: "Raspberries: 1 part =", ans: 200, unit: "g" },
        { label: "Total Mass = 400 +", ans: 200, unit: "" },
        { label: "Total Mass =", ans: 600, unit: "g" }
      ]
    },
    {
      id: 3,
      title: "Question 3: Money Sharing (3 : 5)",
      text: "Xavier and Alicia share some money in the ratio 3:5. Xavier gets $75.",
      guided: true,
      ratio: [
        { label: "Xavier (3)", parts: 3, color: "#3b82f6", knownVal: "= $75 total" },
        { label: "Alicia (5)", parts: 5, color: "#8b5cf6", knownVal: "" }
      ],
      inputs: [
        { label: "Xavier: 3 parts = $75, so 1 part = 75 ÷ 3 =", ans: 25, unit: "$" },
        { label: "Alicia: 5 parts = 5 ×", ans: 25, unit: "" },
        { label: "Alicia Gets =", ans: 125, unit: "$" },
        { label: "Total Shared = 75 +", ans: 125, unit: "" },
        { label: "Total Amount =", ans: 200, unit: "$" }
      ]
    },
    {
      id: 4,
      title: "Question 4: Electricity Bill (3 : 4)",
      text: "Kaya and Akiko share their electricity bills in the ratio 3:4. In January Akiko pays $24.",
      guided: true,
      ratio: [
        { label: "Kaya (3)", parts: 3, color: "#06b6d4", knownVal: "" },
        { label: "Akiko (4)", parts: 4, color: "#10b981", knownVal: "= $24 total" }
      ],
      inputs: [
        { label: "Akiko: 4 parts = $24, so 1 part = 24 ÷ 4 =", ans: 6, unit: "$" },
        { label: "Kaya: 3 parts = 3 ×", ans: 6, unit: "" },
        { label: "Kaya Pays =", ans: 18, unit: "$" },
        { label: "Total Bill = 18 + 24 =", ans: 42, unit: "$" }
      ]
    },
    {
      id: 5,
      title: "Question 5: Concrete Mixture (1 : 2 : 4)",
      text: "When Jerry makes concrete, he uses cement, sand and gravel in the ratio 1:2:4. For one wall he uses 15kg of sand.",
      guided: true,
      ratio: [
        { label: "Cement (1)", parts: 1, color: "#94a3b8", knownVal: "" },
        { label: "Sand (2)", parts: 2, color: "#eab308", knownVal: "= 15kg total" },
        { label: "Gravel (4)", parts: 4, color: "#64748b", knownVal: "" }
      ],
      inputs: [
        { label: "Sand: 2 parts = 15kg, so 1 part = 15 ÷ 2 =", ans: 7.5, unit: "kg" },
        { label: "Cement: 1 part =", ans: 7.5, unit: "kg" },
        { label: "Gravel: 4 parts = 4 ×", ans: 7.5, unit: "" },
        { label: "Gravel Mass =", ans: 30, unit: "kg" },
        { label: "Total Mass = 15 + 7.5 + 30 =", ans: 52.5, unit: "kg" }
      ]
    },

    // --- 3 UNGUIDED INDEPENDENT CHALLENGE QUESTIONS ---
    {
      id: 6,
      title: "Challenge 1: Sharing Sweets (4 : 7 : 9)",
      text: "Three children share sweets in the ratio 4 : 7 : 9. The child with the most sweets gets 54 sweets.",
      guided: false,
      inputs: [
        { label: "a) How many sweets does the child with 4 parts get?", ans: 24, unit: "sweets" },
        { label: "b) How many sweets does the child with 7 parts get?", ans: 42, unit: "sweets" },
        { label: "c) What is the total number of sweets shared altogether?", ans: 120, unit: "sweets" }
      ]
    },
    {
      id: 7,
      title: "Challenge 2: Green Paint Mixture (4 : 5 : 1)",
      text: "Xavier mixes yellow, blue, and white paint in the ratio 4 : 5 : 1 to make green paint. He uses 600 mL of yellow paint.",
      guided: false,
      inputs: [
        { label: "a) How much blue paint does he use?", ans: 750, unit: "mL" },
        { label: "b) How much white paint does he use?", ans: 150, unit: "mL" },
        { label: "c) Total green paint made in litres (1 L = 1000 mL):", ans: 1.5, unit: "litres" }
      ]
    },
    {
      id: 8,
      title: "Challenge 3: Purple Gold Jewelry (4 : 1)",
      text: "Purple gold is made from gold and aluminium in the ratio 4 : 1. A purple gold bracelet has 39g more gold than aluminium.",
      guided: false,
      inputs: [
        { label: "a) What is the mass of 1 part in grams? (Hint: difference in parts = 4 - 1)", ans: 13, unit: "g" },
        { label: "b) What is the total mass of the bracelet?", ans: 65, unit: "g" }
      ]
    }
  ];

  let currentIdx = 0;
  let score = 0;
  let streak = 0;
  let attemptCount = 0;
  let teacherLogs = [];

  const canvas = document.getElementById('confettiCanvas');
  const ctx = canvas.getContext('2d');
  let confettiParticles = [];

  function resizeCanvas() {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
  }
  window.addEventListener('resize', resizeCanvas);
  resizeCanvas();

  function triggerConfetti() {
    confettiParticles = [];
    const colors = ['#4f46e5', '#06b6d4', '#ffcc00', '#10b981', '#f43f5e'];
    for (let i = 0; i < 60; i++) {
      confettiParticles.push({
        x: window.innerWidth / 2,
        y: window.innerHeight / 2,
        vx: (Math.random() - 0.5) * 10,
        vy: (Math.random() - 0.5) * 10 - 3,
        size: Math.random() * 8 + 4,
        color: colors[Math.floor(Math.random() * colors.length)],
        life: 100
      });
    }
    requestAnimationFrame(updateConfetti);
  }

  function updateConfetti() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    confettiParticles.forEach((p, index) => {
      p.x += p.vx;
      p.y += p.vy;
      p.vy += 0.2;
      p.life -= 1.5;
      ctx.fillStyle = p.color;
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
      ctx.fill();
      if (p.life <= 0) confettiParticles.splice(index, 1);
    });
    if (confettiParticles.length > 0) requestAnimationFrame(updateConfetti);
  }

  function renderQuestion() {
    attemptCount = 0;
    const q = questions[currentIdx];
    document.getElementById("probNum").textContent = `Problem ${currentIdx + 1} of ${questions.length}`;
    document.getElementById("probText").textContent = q.text;
    document.getElementById("nextBtn").style.display = "none";
    document.getElementById("checkBtn").style.display = "inline-block";

    const pictorialCard = document.getElementById("pictorialCard");
    const barContainer = document.getElementById("barModelContainer");

    if (q.guided) {
      pictorialCard.style.display = "block";
      barContainer.innerHTML = "";
      q.ratio.forEach(r => {
        const row = document.createElement("div");
        row.className = "bar-row";
        let blocksHTML = "";
        for (let i = 0; i < r.parts; i++) {
          blocksHTML += `<div class="unit-block" style="background: ${r.color};">1 part</div>`;
        }
        row.innerHTML = `
          <div class="bar-label">${r.label}</div>
          <div class="bar-units-group">${blocksHTML}</div>
          ${r.knownVal ? `<div class="known-badge">${r.knownVal}</div>` : ''}
        `;
        barContainer.appendChild(row);
      });
      document.getElementById("mascotText").textContent = "Look at the Bar Model picture to solve step-by-step!";
    } else {
      pictorialCard.style.display = "none";
      document.getElementById("mascotText").textContent = "⚡ Independent Practice Zone! Solve directly without hints or bar diagrams.";
    }

    const container = document.getElementById("workingContainer");
    container.innerHTML = "";

    if (!q.guided) {
      const badge = document.createElement("div");
      badge.className = "challenge-badge";
      badge.textContent = "🎯 Independent Challenge Mode (No Scaffolding Hints)";
      container.appendChild(badge);
    }

    q.inputs.forEach((item, idx) => {
      const row = document.createElement("div");
      row.className = "step-line";
      row.innerHTML = `
        <span>${item.label}</span>
        <input type="number" step="any" id="inp_${idx}" class="math-input" placeholder="?">
        <span>${item.unit}</span>
      `;
      container.appendChild(row);
    });
  }

  function checkAnswer() {
    attemptCount++;
    const q = questions[currentIdx];
    let allCorrect = true;
    let studentInputsSummary = [];

    q.inputs.forEach((item, idx) => {
      const inputElem = document.getElementById(`inp_${idx}`);
      const val = parseFloat(inputElem.value);
      studentInputsSummary.push(inputElem.value !== "" ? inputElem.value : "Empty");

      if (!isNaN(val) && Math.abs(val - item.ans) < 0.01) {
        inputElem.className = "math-input correct";
      } else {
        inputElem.className = "math-input incorrect";
        allCorrect = false;
      }
    });

    logTeacherData(q.title, studentInputsSummary.join(", "), attemptCount, allCorrect);

    if (allCorrect) {
      score += q.guided ? 10 : 20;
      streak += 1;
      document.getElementById("scoreVal").textContent = score;
      document.getElementById("streakVal").textContent = streak;

      triggerConfetti();
      document.getElementById("mascotText").textContent = q.guided ? 
        "EXCELLENT! You solved the bar model and details correctly!" : 
        "WOW! Mastered the unguided challenge problem!";
      
      document.getElementById("checkBtn").style.display = "none";
      document.getElementById("nextBtn").style.display = "inline-block";
    } else {
      streak = 0;
      document.getElementById("streakVal").textContent = streak;
      document.getElementById("mascotText").textContent = "Some answers are incorrect. Re-check your calculations!";
    }
  }

  function toggleTeacherDashboard() {
    const panel = document.getElementById("teacherPanel");
    if (panel.style.display === "block") {
      panel.style.display = "none";
    } else {
      const pwd = prompt("Enter Teacher Password:");
      if (pwd === "teacher123") {
        panel.style.display = "block";
      } else if (pwd !== null) {
        alert("Incorrect password!");
      }
    }
  }

  function logTeacherData(qTitle, inputSummary, attempts, isCorrect) {
    const timeStr = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', second: '2-digit' });
    teacherLogs.unshift({
      time: timeStr,
      question: qTitle,
      inputs: inputSummary,
      attempts: attempts,
      status: isCorrect ? "CORRECT" : "NEEDS REVISION"
    });
    renderTeacherDashboard();
  }

  function renderTeacherDashboard() {
    const tbody = document.getElementById("teacherLogBody");
    tbody.innerHTML = "";
    teacherLogs.forEach(log => {
      const tr = document.createElement("tr");
      tr.innerHTML = `
        <td>${log.time}</td>
        <td>${log.question}</td>
        <td><code>[${log.inputs}]</code></td>
        <td>${log.attempts}</td>
        <td><span class="status-tag ${log.status === 'CORRECT' ? 'status-correct' : 'status-incorrect'}">${log.status}</span></td>
      `;
      tbody.appendChild(tr);
    });
  }

  function nextQuestion() {
    currentIdx = (currentIdx + 1) % questions.length;
    renderQuestion();
  }

  window.onload = renderQuestion;
</script>

</body>
</html>
